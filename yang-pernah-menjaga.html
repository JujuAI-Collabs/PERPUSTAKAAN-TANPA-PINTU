<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#d4af37;font-family:Georgia,serif}
.header{text-align:center;padding:42px 18px 28px;border-bottom:1px solid #5d4b25}

.gallery{width:min(1100px,94%);margin:30px auto 46px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.poster{background:#0d0d0d;border:1px solid #4d3d20;padding:6px}
.poster img{display:block;width:100%;height:auto}
.footer{text-align:center;padding:24px 15px 35px;border-top:1px solid #5d4b25;color:#806d3d;font-size:12px;letter-spacing:.08em}
.footer a{color:#b89b55;text-decoration:none}

</style>
</head>
