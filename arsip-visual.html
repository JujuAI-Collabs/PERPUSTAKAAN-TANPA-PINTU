<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arsip Visual — Perpustakaan Tanpa Pintu</title><style>:root{--bg:#080a10;--card:#151827;--gold:#f5c16c;--muted:#9b9daa;--line:#2b2e40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8e6e3;font-family:Georgia,serif;text-align:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(ellipse at 25% 20%,rgba(245,193,108,.11),transparent 48%),radial-gradient(ellipse at 80% 75%,rgba(90,150,190,.10),transparent 50%);animation:bgFloat 12s ease-in-out infinite alternate}@keyframes bgFloat{to{transform:scale(1.08)}}.back{display:inline-block;margin:20px;padding:9px 16px;border:1px solid rgba(245,193,108,.28);border-radius:10px;background:var(--card);color:var(--gold);text-decoration:none}h1{margin:20px 15px 8px;color:var(--gold);letter-spacing:2px;font-size:clamp(1.65rem,6vw,2.4rem)}.intro{margin:0 15px 18px;color:var(--muted)}.grid{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10px 18px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-3px);border-color:rgba(245,193,108,.45)}.card img{width:100%;aspect-ratio:3/4.3;object-fit:cover;display:block;background:#0e1220}.card p{margin:0;padding:10px 7px;color:var(--muted);font-size:.8rem;line-height:1.35}.card.coming{min-height:180px;display:flex;flex-direction:column;justify-content:center;opacity:.65}.card.coming .slot{font-size:2rem;color:var(--gold);margin-bottom:8px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);padding-left:12px;padding-right:12px;gap:11px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><a href="index.html" class="back">← Kembali</a><h1>ARSIP VISUAL</h1><p class="intro">Koleksi visual Perpustakaan Tanpa Pintu.</p><div class="grid" id="gallery"><p style="grid-column:1/-1;color:var(--muted)">Memuat...</p></div><script>async function initGallery(){const root=document.getElementById('gallery');try{const r=await fetch('./data.json?v='+Date.now());if(!r.ok)throw new Error(r.status);const data=await r.json(),images=(data.gallery&&data.gallery.images)||[];root.innerHTML='';images.forEach(item=>{if(item.status==='coming'){const n=item.file.replace(/\.jpg$/i,'');root.innerHTML+=`<div class="card coming"><div class="slot">${n}</div><p>${item.label}</p></div>`;return}root.innerHTML+=`<div class="card"><img src="${item.file}" alt="${item.label}" loading="lazy"><p>${item.label}</p></div>`})}catch(e){root.innerHTML='<p style="grid-column:1/-1;color:#9b9daa">Arsip visual belum dapat dimuat.</p>';console.warn(e)}}initGallery();</script></body></html>
