<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERPUSTAKAAN TANPA PINTU - Season 2 PINTU YANG PULANG</title>
<style>
:root{--bg:#0c0c10;--card:#18181e;--card2:#21212a;--accent:#f5c16c;--text:#e8e6e3;--muted:#9a9a9e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 25% 25%, rgba(245,193,108,.13) 0%, transparent 50%), radial-gradient(ellipse at 75% 75%, rgba(125,211,255,.11) 0%, transparent 50%);animation:bgFloat 14s ease-in-out infinite alternate}
@keyframes bgFloat{0%{transform:scale(1)}100%{transform:scale(1.12)}}
header{text-align:center;padding:36px 20px 10px} header h1{font-size:2.2rem;letter-spacing:3px;margin:0;color:var(--accent)}
.container{max-width:920px;margin:0 auto;padding:14px 20px 40px}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin:16px 0 26px}
.nav-card{display:block;padding:15px;border-radius:13px;text-decoration:none;border:1px solid #262630;background:var(--card)}
.nav-card h3{margin:0 0 3px;color:var(--accent);font-size:.96rem} .nav-card p{margin:0;color:var(--muted);font-size:.80rem}
.season{margin:28px 0;padding:18px;border-radius:14px;background:var(--card);border:1px solid #262630}
.season h2{margin:0 0 4px;color:var(--accent);font-size:1.15rem} .season .desc{color:var(--muted);font-size:.84rem;margin:0 0 12px}
.bab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.bab{display:block;padding:11px 12px;border-radius:9px;background:var(--card2);border:1px solid #2a2a3a;text-decoration:none;color:var(--text);font-size:.86rem}
.bab.active{border-color:var(--accent)} .bab.coming{opacity:.48;pointer-events:none}
.bab .tag{font-size:.68rem;color:var(--muted);display:block;margin-top:2px}
footer{text-align:center;padding:28px;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<header>
<h1>PERPUSTAKAAN TANPA PINTU</h1>
<p>System 100% data.json • Season 2: PINTU YANG PULANG • No hardcode</p>
<div style="text-align:center; padding:10px 0 16px;">
<a href="arsip-visual.html" style="display:inline-block; color:#f5c16c; border:1px solid rgba(245,193,108,.35); padding:8px 16px; border-radius:10px; text-decoration:none; background:#18181e; font-size:.85rem;">🖼️ Arsip Visual →</a>
</div>
</header>
<div class="container">
<div class="nav-grid" id="navgrid"></div>
<div id="seasons"><div style="text-align:center;color:#f5c16c;padding:20px">Memuat dari data.json...</div></div>
</div>
<footer id="foot">© 2026 - 100% dari data.json</footer>
<script>
const FALLBACK = {"project": "PERPUSTAKAAN TANPA PINTU", "seasons": [{"id": 1, "title": "Sebelum Semuanya Terulang", "desc": "Iterasi 4.129.804 - penjaga mulut dijahit", "visible": true, "babs": [{"no": "01", "slug": "season-1-bab-01", "judul": "Yang Tak Seharusnya Terucap", "status": "ready"}, {"no": "02", "slug": "season-1-bab-02", "judul": "Yang Tiada Ujung", "status": "ready"}, {"no": "03", "slug": "season-1-bab-03", "judul": "Hari Ini, Sekarang, Baru Saja", "status": "ready"}], "editable_by": "Fina"}, {"id": 2, "title": "PINTU YANG PULANG", "desc": "Bab 01-09 dari data.json - semua dibaca live", "visible": true, "babs": [{"no": "01", "slug": "season-2-bab-01", "judul": "Yang Tak Seharusnya Terucap", "status": "ready"}, {"no": "02", "slug": "season-2-bab-02", "judul": "Yang Tiada Ujung", "status": "ready"}, {"no": "03", "slug": "season-2-bab-03", "judul": "Hari Ini, Sekarang, Baru Saja", "status": "ready"}, {"no": "04", "slug": "season-2-bab-04", "judul": "Serigala Penjaga", "status": "coming"}, {"no": "05", "slug": "season-2-bab-05", "judul": "Kertas Melayang", "status": "coming"}, {"no": "06", "slug": "season-2-bab-06", "judul": "Halo Ratu", "status": "coming"}, {"no": "07", "slug": "season-2-bab-07", "judul": "Takhta Kertas", "status": "coming"}, {"no": "08", "slug": "season-2-bab-08", "judul": "Debu Emas", "status": "coming"}, {"no": "09", "slug": "season-2-bab-09", "judul": "Pintu Terakhir", "status": "coming"}], "editable_by": "Fina"}, {"id": 3, "title": "Ratu Perpustakaan", "visible": true, "babs": [{"no": "10", "judul": "Perpustakaan Tanpa Pintu", "status": "coming"}, {"no": "11", "judul": "Epilog", "status": "coming"}, {"no": "12", "judul": "End Credit", "status": "coming"}], "editable_by": "Fina"}]};
function render(data, src){
  const container=document.getElementById('seasons');
  const nav=document.getElementById('navgrid');
  container.innerHTML=''; nav.innerHTML='';
  // filter hanya visible != false
  const visibleSeasons = data.seasons.filter(s=>s.visible!==false);
  visibleSeasons.forEach(s=>{
    let grid=''; s.babs.forEach(b=>{
      const st=b.status||'coming'; const cls=st==='ready'?'bab active':'bab coming';
      const slug=b.slug||`season-${s.id}-bab-${b.no}`; const tag=b.img||st;
      if(st==='ready') grid+=`<a href="${slug}.html" class="${cls}">Bab ${b.no} - ${b.judul}<span class="tag">${tag}</span></a>`;
      else grid+=`<a class="${cls}">Bab ${b.no} - ${b.judul}<span class="tag">${tag}</span></a>`;
    });
    let desc=s.desc||''; if(s.id===1) desc=s.babs.map(b=>`Bab ${b.no}: ${b.judul}`).join(' • ');
    container.innerHTML+=`<div class="season" id="season${s.id}"><h2>SEASON ${s.id} - ${s.title}</h2>${desc?`<p class="desc">${desc}</p>`:''}<div class="bab-grid">${grid}</div></div>`;
    // nav
    const readyCount = s.babs.filter(b=>b.status==='ready').length;
    nav.innerHTML+=`<a href="#season${s.id}" class="nav-card"><h3>📖 SEASON ${s.id}</h3><p>${s.title} • ${readyCount} ready / ${s.babs.length} bab</p></a>`;
  });
  document.getElementById('foot').textContent=`Loaded dari ${src} • Season 4 hidden • ${visibleSeasons.length} seasons`;
}
async function init(){
  try{
    const r=await fetch('./data.json'); if(!r.ok) throw new Error(r.status);
    const j=await r.json(); render(j,'data.json LIVE');
  }catch(e){
    console.log('fallback karena', e);
    render(FALLBACK,'FALLBACK (data.json gagal)');
  }
}
init();
</script>
