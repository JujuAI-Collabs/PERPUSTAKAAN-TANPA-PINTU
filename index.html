<style>
:root{--bg:#0c0c10;--card:#18181e;--card2:#21212a;--accent:#f5c16c;--text:#e8e6e3;--muted:#9a9a9e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-12%;z-index:-2;background:radial-gradient(ellipse at 25% 25%,rgba(245,193,108,.13) 0%,transparent 50%),radial-gradient(ellipse at 75% 75%,rgba(125,211,255,.11) 0%,transparent 50%);animation:bgFloat 16s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.025) 45%,transparent 55%);transform:translateX(-110%);animation:lightSweep 12s ease-in-out infinite}
@keyframes bgFloat{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.12) translate3d(1%,-1%,0)}}
@keyframes lightSweep{0%,55%{transform:translateX(-110%)}75%,100%{transform:translateX(110%)}}
header{text-align:center;padding:36px 20px 10px;animation:headerIn .9s ease-out both}
@keyframes headerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
header h1{font-size:2.2rem;letter-spacing:3px;margin:0;color:var(--accent);animation:titlePulse 5s ease-in-out infinite}
@keyframes titlePulse{0%,100%{text-shadow:0 0 0 rgba(245,193,108,0)}50%{text-shadow:0 0 18px rgba(245,193,108,.18)}}
.container{max-width:920px;margin:0 auto;padding:14px 20px 40px}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin:16px 0 26px}
.nav-card{display:block;padding:15px;border-radius:13px;text-decoration:none;border:1px solid #262630;background:var(--card);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.nav-card:hover{transform:translateY(-4px);box-shadow:0 9px 24px rgba(0,0,0,.28);border-color:rgba(245,193,108,.38)}
.nav-card h3{margin:0 0 3px;color:var(--accent);font-size:.96rem}.nav-card p{margin:0;color:var(--muted);font-size:.80rem}
.season{margin:28px 0;padding:18px;border-radius:14px;background:var(--card);border:1px solid #262630;animation:seasonIn .7s ease-out both;position:relative;overflow:hidden}
.season::after{content:"";position:absolute;top:0;left:-35%;width:25%;height:1px;background:rgba(245,193,108,.55);animation:seasonGlint 8s ease-in-out infinite}
@keyframes seasonIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes seasonGlint{0%,70%{left:-35%;opacity:0}80%{opacity:1}100%{left:120%;opacity:0}}
.season h2{margin:0 0 4px;color:var(--accent);font-size:1.15rem}.season .desc{color:var(--muted);font-size:.84rem;margin:0 0 12px}
.bab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.bab{display:block;padding:11px 12px;border-radius:9px;background:var(--card2);border:1px solid #2a2a3a;text-decoration:none;color:var(--text);font-size:.86rem;transition:transform .2s ease,border-color .2s ease,background .2s ease}
.bab:hover{transform:translateX(4px);border-color:rgba(245,193,108,.42);background:#25252f}
.bab.active{border-color:var(--accent)}.bab.coming{opacity:.48;pointer-events:none}
.bab .tag{font-size:.68rem;color:var(--muted);display:block;margin-top:2px}
footer{text-align:center;padding:28px;color:var(--muted);font-size:.78rem}
@media(max-width:600px){header{padding-top:28px}header h1{font-size:1.65rem;letter-spacing:2px}.container{padding-left:14px;padding-right:14px}.season{margin:20px 0;padding:15px}.nav-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<header>
<h1>PERPUSTAKAAN TANPA PINTU</h1>
<p>System 100% data.json • Season 2: PINTU YANG PULANG • Animasi by Fina ✨</p>
<div style="text-align:center;padding:10px 0 16px"><a href="arsip-visual.html" style="display:inline-block;color:#f5c16c;border:1px solid rgba(245,193,108,.35);padding:8px 16px;border-radius:10px;text-decoration:none;background:#18181e;font-size:.85rem">🖼️ Arsip Visual →</a></div>
</header>
<div class="container"><div class="nav-grid" id="navgrid"></div><div id="seasons"><div style="text-align:center;color:#f5c16c;padding:20px">Memuat dari data.json...</div></div></div>

function render(data,src){
  const container=document.getElementById('seasons'),nav=document.getElementById('navgrid');
  container.innerHTML='';nav.innerHTML='';
  const visibleSeasons=(data.seasons||[]).filter(s=>s.visible!==false);
  visibleSeasons.forEach((s,i)=>{
    let grid='';(s.babs||[]).forEach(b=>{
      const st=b.status||'coming',cls=st==='ready'?'bab active':'bab coming',slug=b.slug||`season-${s.id}-bab-${b.no}`,tag=b.img||st;
      if(st==='ready') grid+=`<a href="${slug}.html" class="cls">Bab ${b.no} - ${b.judul}<span class="tag">${tag}</span></a>`;
      else grid+=`<a class="${cls}">Bab ${b.no} - ${b.judul}<span class="tag">${tag}</span></a>`;
    });
    let desc=s.desc||'';
    container.innerHTML+=`<div class="season" id="season${s.id}" style="animation-delay:${i*.08}s"><h2>SEASON ${s.id} - ${s.title}</h2>${desc?`<p class="desc">${desc}</p>`:''}<div class="bab-grid">${grid}</div></div>`;
    const readyCount=(s.babs||[]).filter(b=>b.status==='ready').length;
    nav.innerHTML+=`<a href="#season${s.id}" class="nav-card"><h3>📖 SEASON ${s.id}</h3><p>${s.title} • ${readyCount} ready / ${s.babs.length} bab</p></a>`;
  });
  document.getElementById('foot').textContent=`Loaded dari ${src} • ${visibleSeasons.length} seasons • Foto: ${data.gallery?data.gallery.images.length:0} foto • Animasi by Fina`;
}
async function init(){
  try{
    const r=await fetch('./data.json?v='+Date.now());if(!r.ok)throw new Error(r.status);
    const j=await r.json();render(j,'data.json LIVE');
  }catch(e){
    console.log('fallback karena',e);
    render(FALLBACK,'FALLBACK (data.json gagal)');
  }
}
init();
</script>
