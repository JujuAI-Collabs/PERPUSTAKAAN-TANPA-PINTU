pg - Slot 06 Coming Soon","status":"coming"},{"file":"07.jpg","label":"07.jpg - Slot 07 Coming Soon","status":"coming"},{"file":"08.jpg","label":"08.jpg - Slot 08 Coming Soon","status":"coming"},{"file":"09.jpg","label":"09.jpg - Slot 09 Coming Soon","status":"coming"},{"file":"10.jpg","label":"10.jpg - Slot 10 Coming Soon","status":"coming"},{"file":"cover.jpg","label":"cover.jpg"}]}};function render(data){const nav=document.getElementById('navgrid'),seasons=document.getElementById('seasons');nav.innerHTML='';seasons.innerHTML='';const visible=(data.seasons||[]).filter(s=>s.visible!==false);visible.forEach((s,i)=>{const babs=s.babs||[];nav.innerHTML+=`<a class="nav-card" href="#season${s.id}"><strong>📖 SEASON ${s.id}</strong><span>${s.title} • ${babs.length} bab</span></a>`;let grid='';babs.forEach(b=>{const ready=b.status==='ready',cls=ready?'bab':'bab coming',slug=b.slug||`season-${s.id}-bab-${b.no}`;grid+=ready?`<a class="${cls}" href="${slug}.html">Bab ${b.no} - ${b.judul}</a>`:`<div class="${cls}">Bab ${b.no} - ${b.judul}</div>`});seasons.innerHTML+=`<section class="season" id="season${s.id}" style="animation-delay:${i*.08}s"><h2>SEASON ${s.id} - ${s.title}</h2><p class="desc">${s.desc||''}</p><div class="bab-grid">${grid}</div></section>`})}async function init(){try{const r=await fetch('./data.json?v='+Date.now());if(!r.ok)throw new Error(r.status);render(await r.json())}catch(e){console.warn('data.json gagal dimuat, memakai fallback.',e);render(FALLBACK)}}init();</script></body></html>
